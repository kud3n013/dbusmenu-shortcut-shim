name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git glib2 libdbusmenu-glib libdbusmenu-gtk3 gtk3 pkgconf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches Makefile VERSION
        run: |
          version=$(sed -n 's/^VERSION := //p' Makefile)
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != VERSION v${version}"; exit 1; }
      - name: Test
        run: make test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build tarball and checksum
        run: |
          version=$(sed -n 's/^VERSION := //p' Makefile)
          name="dbusmenu-shortcut-shim-${version}"
          git archive --prefix="${name}/" HEAD | gzip -n > "${name}.tar.gz"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          cat "${name}.tar.gz.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes dbusmenu-shortcut-shim-*.tar.gz dbusmenu-shortcut-shim-*.tar.gz.sha256
